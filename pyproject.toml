[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reveal"
version = "0.1.0"
description = "Residual harness on toe two-gyro + vortex_math 9/π. Measures residuals. Does not name God."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.8",
    "flux-hopf-lib",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reveal = "reveal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reveal"]

[tool.hatch.build.targets.wheel.sources]
"src/reveal" = "reveal"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
